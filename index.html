<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The People's Mandate — Prototype v0.1</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --accent:#2e9e6b; --accent2:#c9a24b;
    --text:#eef1f6; --muted:#93a0b4; --bad:#c0463c;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;}
  #app{display:grid;grid-template-columns:260px 1fr 300px;height:100vh;}
  .panel{padding:14px;overflow-y:auto;}
  #left{background:#121829;border-right:1px solid #243049;}
  #center{display:flex;flex-direction:column;justify-content:space-between;}
  #right{background:#121829;border-left:1px solid #243049;}
  h1{font-size:18px;color:var(--accent2);margin:0 0 10px;}
  h2{font-size:14px;color:var(--accent2);border-bottom:1px solid #243049;padding-bottom:4px;}
  .stat{margin-bottom:8px;font-size:12px;}
  .stat .bar{background:#243049;border-radius:4px;height:8px;overflow:hidden;margin-top:2px;}
  .stat .fill{height:100%;background:var(--accent);}
  #story{flex:1;padding:26px 36px;overflow-y:auto;}
  #speaker{color:var(--accent2);font-weight:600;margin-bottom:6px;}
  #text{font-size:16px;line-height:1.6;margin-bottom:18px;white-space:pre-line;}
  .choice{display:block;width:100%;text-align:left;background:#1c2742;color:var(--text);
    border:1px solid #2e3b5c;border-radius:8px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:14px;}
  .choice:hover{background:#273762;border-color:var(--accent);}
  .choice:disabled{opacity:0.35;cursor:not-allowed;}
  #footer{padding:10px 20px;border-top:1px solid #243049;display:flex;gap:10px;background:#121829;}
  button.util{background:#243049;color:var(--text);border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;}
  button.util:hover{background:#2e3b5c;}
  .journal-entry{font-size:12px;border-left:2px solid var(--accent);padding:4px 8px;margin-bottom:8px;color:var(--muted);}
  .civic-note{background:#1c2742;border:1px dashed var(--accent2);border-radius:6px;padding:10px;font-size:12px;margin-top:10px;}
  .tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:10px;margin-right:6px;}
  .tag.verified{background:#1d4d35;color:#9fe3bd;}
  .tag.verified-general{background:#4d431d;color:#e3d19f;}
  .tag.fictional{background:#4d1d1d;color:#e39f9f;}
  #setup{position:fixed;inset:0;background:#0f1420;display:flex;align-items:center;justify-content:center;z-index:10;}
  .setupbox{background:#161d2e;padding:30px;border-radius:12px;width:400px;}
  .setupbox input, .setupbox select{width:100%;padding:8px;margin:6px 0 14px;border-radius:6px;border:1px solid #2e3b5c;background:#0f1420;color:var(--text);}
  .setupbox button{width:100%;padding:10px;background:var(--accent);border:none;border-radius:6px;color:white;font-weight:600;cursor:pointer;}
  #roadmap-item{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .locked{opacity:0.5;}
</style>
</head>
<body>

<div id="setup">
  <div class="setupbox">
    <h1>THE PEOPLE'S MANDATE</h1>
    <p style="color:var(--muted);font-size:13px;">Create your citizen. This is a fictional country, fictional characters. Any resemblance to real persons or parties is coincidental.</p>
    <label>Name</label>
    <input id="inName" placeholder="e.g. Tari Briggs" value="Tari Briggs">
    <label>State of Origin</label>
    <select id="inState">
      <option>Lagos</option><option>Kano</option><option>Rivers</option>
      <option>Kaduna</option><option>Oyo</option><option>Benue</option>
      <option>Plateau</option><option>Borno</option><option>Ogun</option><option>Abuja (FCT)</option>
    </select>
    <label>Background</label>
    <select id="inArche">
      <option value="trader">Trader's Child — street-smart, resourceful</option>
      <option value="civil">Civil Servant's Child — process-minded</option>
      <option value="grad">Returnee Graduate — idealistic, outsider eyes</option>
      <option value="activist">Campus Activist — bold, confrontational</option>
    </select>
    <button onclick="startGame()">Begin</button>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="left" class="panel">
    <h1>MANDATE</h1>
    <h2>Civic Standing</h2>
    <div id="stats"></div>
    <h2>Relationships</h2>
    <div id="relationships"></div>
  </div>

  <div id="center">
    <div id="story">
      <div id="speaker"></div>
      <div id="text"></div>
      <div id="choices"></div>
      <div id="civicNoteBox"></div>
    </div>
    <div id="footer">
      <button class="util" onclick="saveGame()">💾 Save</button>
      <button class="util" onclick="loadGame()">⤴ Load</button>
      <button class="util" onclick="resetGame()">⟲ Reset</button>
      <button class="util" onclick="toggleJournal()">📓 Journal</button>
      <span style="flex:1;"></span>
      <span style="font-size:12px;color:var(--muted);" id="missionLabel"></span>
    </div>
  </div>

  <div id="right" class="panel">
    <h2>Roadmap — Chapter 1 & 2</h2>
    <div id="roadmap"></div>
    <h2 style="margin-top:16px;">Journal</h2>
    <div id="journal"></div>
  </div>
</div>

  {id:"m11", title:"The Approach", status:"locked", teaser:"Chapter 3 begins — someone wants to talk politics."}

  const candidateProfile = {
  ideology: {           // -100 (interventionist) to +100 (market-oriented) etc. Purely descriptive, not "good/bad"
    economicApproach: 0,
    socialApproach: 0,
    governanceStyle: 0   // -100 (centralizing) to +100 (devolving/consultative)
  },
  policyPriorities: [],  // ranked list, max 3 chosen from a pool (education, health, roads, agriculture, security, jobs, anti-corruption)
  publicRecord: {        // auto-populated from Chapters 1-2 flags — this is the "receipts" system
    integrityScore: GS.stats.integrity,
    participationScore: GS.stats.citizenParticipation,
    knownVoteBuyer: GS.flags.known_vote_buyer || false,
    hasEvidenceCredibility: GS.flags.has_vote_buying_evidence || false
  },
  disclosedFunding: [],   // {source, amount, disclosed:true/false}
  partyId: null
};

  function runPrimary(partyId, candidateProfile, delegateCount = 50){
  // Each delegate is a simple weighted-preference agent, not a monolith
  let delegates = generateDelegates(delegateCount, partyId);
  let votes = 0;

  delegates.forEach(delegate=>{
    let score = 0;
    score += delegate.weighting.integrity * candidateProfile.publicRecord.integrityScore;
    score += delegate.weighting.loyalty * relationshipWithPartyLeadership(candidateProfile);
    score += delegate.weighting.money * candidateProfile.disclosedFunding.reduce((a,f)=>a+f.amount,0) / 1000000;
    score += delegate.weighting.ethnicRegional * identityAffinity(delegate, candidateProfile); // modeled as ONE of several factors, never sole determinant
    score -= candidateProfile.publicRecord.knownVoteBuyer ? delegate.integrityPenaltySensitivity * 10 : 0;

    if(score > delegate.threshold) votes++;
  });

  return {
    votesWon: votes,
    totalDelegates: delegateCount,
    won: votes > delegateCount/2
  };
}

function generateDelegates(count, partyId){
  // Different parties produce different delegate "personalities" —
  // FAP delegates weight integrity/money less on loyalty; PUC delegates weight loyalty/patronage heavily; etc.
  const archetypes = PARTY_DELEGATE_PROFILES[partyId];
  return Array.from({length:count}, ()=>{
    const a = archetypes[Math.floor(Math.random()*archetypes.length)];
    return { ...a, threshold: 40 + Math.random()*20 };
  });
}
  function checkHiddenFundingExposure(GS){
  if(GS.flags.undisclosed_funding_risk && Math.random() < 0.35){
    GS.flags.funding_scandal_triggered = true;
    addJournal("⚠ A financial disclosure inconsistency has been flagged by investigative reporters.");
  }
}

/* ---------------- ENGINE ---------------- */

function startGame(){
  const name = document.getElementById('inName').value || "Player";
  const st = document.getElementById('inState').value;
  const arch = document.getElementById('inArche').value;
  GS = freshState(name, st, arch);
  document.getElementById('setup').style.display='none';
  document.getElementById('app').style.display='grid';
  addJournal(`You begin your story in ${st}, as a ${arch === 'trader' ? "trader's child" : arch}.`);
  ();
}

function getVal(obj, path){
  return path.split('.').reduce((o,k)=>o&&o[k]!==undefined?o[k]:undefined, obj);
}
function setVal(obj, path, val){
  const keys = path.split('.');
  let o = obj;
  for(let i=0;i<keys.length-1;i++){ o = o[keys[i]]; }
  o[keys[keys.length-1]] = val;
}
function addVal(obj, path, delta){
  const cur = getVal(obj, path) || 0;
  setVal(obj, path, Math.max(0, Math.min(100, cur + delta)));
}

function applyEffects(effects){
  if(!effects) return;
  for(const key in effects){
    if(key.startsWith('stats.') || key.startsWith('relationships.')){
      addVal(GS, key, effects[key]);
    }
  }
}
function applyFlags(flags){
  if(!flags) return;
  for(const k in flags) GS.flags[k] = flags[k];
}

function checkRequires(req){
  if(!req) return true;
  for(const k in req){
    const val = getVal(GS, k);
    if(val !== req[k] && !(typeof req[k]==='number' && val >= req[k])) {
      // numeric threshold support
      if(typeof req[k]==='number'){ if(!(val>=req[k])) return false; }
      else if(val !== req[k]) return false;
    }
  }
  return true;
}

function addJournal(text){
  GS.journal.unshift({text, t:Date.now()});
}

function currentMissionObj(){ return MISSIONS[GS.currentMission]; }

function render(){
  if(GS.phase && GS.phase !== 'mission'){
    renderPhase();
    return;
  }
  // ...existing mission rendering code stays exactly as-is below this line...
  const mission = currentMissionObj();
  const node = mission.nodes[GS.currentNode];
  document.getElementById('missionLabel').textContent = `Mission: ${mission.title}`;
  document.getElementById('speaker').textContent = node.speaker || "";
  document.getElementById('text').textContent = node.text || "";

  const choicesDiv = document.getElementById('choices');
  choicesDiv.innerHTML = '';
  document.getElementById('civicNoteBox').innerHTML = '';

  (node.choices||[]).forEach(choice=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    const allowed = checkRequires(choice.requires);
    btn.textContent = choice.label + (allowed ? '' : '  🔒');
    btn.disabled = !allowed;
    btn.onclick = ()=> pickChoice(choice);
    choicesDiv.appendChild(btn);
  });

  renderStats();
  renderRelationships();
  renderRoadmap();
  renderJournal();
}

function pickChoice(choice){
  applyEffects(choice.effects);
  applyFlags(choice.setsFlags);
  addJournal(`» ${choice.label}`);

  if(choice.delayedConsequence){
    GS.delayedConsequences.push(choice.delayedConsequence);
  }

  if(choice.civicNote){
    showCivicNote(choice.civicNote);
  }

  if(choice.next === '__END__'){
    endMission();
    return;
  }
  GS.currentNode = choice.next;
  render();
  saveGame();
}

function showCivicNote(id){
  const ref = CIVIC_REF[id];
  if(!ref) return;
  const box = document.getElementById('civicNoteBox');
  box.innerHTML = `<div class="civic-note">
    <span class="tag ${ref.status}">${ref.status.toUpperCase()}</span>
    <strong>Civic Note:</strong> ${ref.text}
  </div>`;
}

function endMission(){
  GS.missionsCompleted.push(GS.currentMission);
  const idx = ROADMAP.findIndex(r=>r.id===GS.currentMission);
  const nextEntry = ROADMAP[idx+1];

  if(nextEntry){
    nextEntry.status = 'active';
    GS.currentMission = nextEntry.id;

    // Resolve delayed consequences targeting this newly active mission
    GS.delayedConsequences = GS.delayedConsequences.filter(dc=>{
      if(dc.triggerMission === GS.currentMission){
        applyEffects(dc.effect);
        addJournal(`(A past choice resurfaces: ${dc.note || 'consequences catch up with you.'})`);
        return false;
      }
      return true;
    });

    if(MISSIONS[GS.currentMission]){
  GS.currentNode = resolveEntryNode(GS.currentMission);
  addJournal(`— Mission "${MISSIONS[GS.currentMission].title}" begins —`);
  render();
  saveGame();
} else {
  // Chapter 2 complete -> transition into Chapter 3
  GS.phase = 'candidate_setup';
  render();
  saveGame();
}
    
// Supports missions with multiple possible starting nodes based on prior flags
function resolveEntryNode(missionId){
  const mission = MISSIONS[missionId];
  if(mission.entryRules){
    for(const rule of mission.entryRules){
      if(checkRequires(rule.requires)) return rule.node;
    }
  }
  return 'n1';
}

function showRoadmapOnlyScreen(){
  document.getElementById('speaker').textContent = "Chapter 1/2 Prototype Complete";
  document.getElementById('text').textContent =
    "You've completed the implemented portion of this prototype. Missions 3–10 are designed and ready for scripting " +
    "in the next development sprint (see roadmap panel). Your accumulated stats and relationships are saved and would " +
    "carry forward into Chapter 3: The Political Aspirant.";
  document.getElementById('choices').innerHTML = '';
  document.getElementById('civicNoteBox').innerHTML = '';
  renderStats(); renderRelationships(); renderRoadmap(); renderJournal();
}

function renderStats(){
  const div = document.getElementById('stats');
  div.innerHTML='';
  for(const key in GS.stats){
    const val = GS.stats[key];
    div.innerHTML += `<div class="stat">${labelize(key)}: ${val}
      <div class="bar"><div class="fill" style="width:${val}%"></div></div></div>`;
  }
}
function renderRelationships(){
  const div = document.getElementById('relationships');
  div.innerHTML='';
  for(const key in GS.relationships){
    const val = GS.relationships[key];
    div.innerHTML += `<div class="stat">${labelize(key)}: ${val>0?'+':''}${val}</div>`;
  }
}
function renderRoadmap(){
  const div = document.getElementById('roadmap');
  div.innerHTML='';
  ROADMAP.forEach(m=>{
    const done = GS.missionsCompleted.includes(m.id);
    const active = m.id === GS.currentMission;
    div.innerHTML += `<div id="roadmap-item" class="${(!done && !active)?'locked':''}">
      ${done?'✅':active?'▶️':'🔒'} ${m.title}${m.teaser?`<br><em>${m.teaser}</em>`:''}
    </div>`;
  });
}
function renderJournal(){
  const div = document.getElementById('journal');
  div.innerHTML='';
  GS.journal.slice(0,20).forEach(j=>{
    div.innerHTML += `<div class="journal-entry">${j.text}</div>`;
  });
}
function toggleJournal(){
  const j = document.getElementById('journal');
  j.style.display = (j.style.display==='none') ? 'block':'none';
}
function labelize(k){
  return k.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase());
}

/* ---------------- SAVE / LOAD ---------------- */
function saveGame(){
  try{ localStorage.setItem('peoplesMandateSave', JSON.stringify(GS)); }
  catch(e){ console.warn('Save failed', e); }
}
function loadGame(){
  const raw = localStorage.getItem('peoplesMandateSave');
  if(!raw){ alert('No save found.'); return; }
  GS = JSON.parse(raw);
  document.getElementById('setup').style.display='none';
  document.getElementById('app').style.display='grid';
  if(!MISSIONS[GS.currentMission]) { showRoadmapOnlyScreen(); return; }
  render();
}
function resetGame(){
  localStorage.removeItem('peoplesMandateSave');
  location.reload();
}

// Attempt auto-load on open
window.addEventListener('load', ()=>{
  const raw = localStorage.getItem('peoplesMandateSave');
  if(raw){
    const resume = confirm('A saved game was found. Resume?');
    if(resume){ loadGame(); }
  }
});
</script>
</body>
</html>
